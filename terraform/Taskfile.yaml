version: "3"

# State is stored as terraform/tfstate.sops (SOPS encrypted with the normal
# homelab age key). Plaintext "tfstate" is gitignored.
#
# Reuses the existing age key (same one as Talos + backups).
# .sops.yaml at repo root provides the creation rules.
#
# The nix dev shell tries to export SOPS_AGE_KEY (works in CI and locally if bao is logged in).
#
# Prefer `task tofu:plan` / `task tofu:apply` — they handle decrypt + re-encrypt.

tasks:
  init:
    desc: tofu init (local backend writing to tfstate)
    cmds:
      - tofu init
    preconditions:
      - sh: command -v tofu
        msg: "tofu not found - enter the nix dev shell first"

  _decrypt-state:
    internal: true
    cmds:
      # Refuses to clobber a plaintext tfstate that is AHEAD of tfstate.sops.
      # That happens whenever a previous tofu run died before _encrypt-state
      # could persist it: the changes are real (already applied to the
      # providers) but live only in the plaintext file. Decrypting over them
      # loses them silently and the next apply fails with "AlreadyExists".
      - |
        if [ ! -f tfstate.sops ]; then
          echo "No tfstate.sops yet (will start with empty state)"
          exit 0
        fi
        decrypted=$(sops --config ../.sops.yaml -d tfstate.sops)
        if [ -f tfstate ]; then
          sops_lineage=$(printf '%s' "$decrypted" | jq -r '.lineage // ""')
          sops_serial=$(printf '%s' "$decrypted" | jq -r '.serial // 0')
          local_lineage=$(jq -r '.lineage // ""' tfstate)
          local_serial=$(jq -r '.serial // 0' tfstate)
          if [ "$sops_lineage" = "$local_lineage" ] && [ "$local_serial" -gt "$sops_serial" ]; then
            echo "" >&2
            echo "REFUSING to overwrite tfstate: the plaintext state is NEWER than tfstate.sops" >&2
            echo "  tfstate (plaintext) serial=$local_serial" >&2
            echo "  tfstate.sops        serial=$sops_serial" >&2
            echo "" >&2
            echo "A previous tofu run failed before its state could be re-encrypted, so the" >&2
            echo "plaintext file holds changes tfstate.sops does not. Inspect it, then run" >&2
            echo "'task state-pull' to promote it - or delete tfstate to discard those changes." >&2
            exit 1
          fi
        fi
        echo "Decrypting tfstate.sops → tfstate"
        printf '%s' "$decrypted" > tfstate
    preconditions:
      - sh: command -v sops
        msg: "sops not found - enter the nix dev shell first"
      - sh: command -v jq
        msg: "jq not found - enter the nix dev shell first"

  _encrypt-state:
    internal: true
    cmds:
      - |
        echo "Writing fresh encrypted state to tfstate.sops"
        # tofu state pull can fail on a brand new backend — fall back gracefully
        if tofu state pull 2>/dev/null | sops --config ../.sops.yaml -e /dev/stdin > tfstate.sops; then
          echo "State encrypted successfully"
        else
          echo "No state to pull yet (new workspace) — creating empty tfstate.sops"
          echo '{}' | sops --config ../.sops.yaml -e /dev/stdin > tfstate.sops
        fi
        rm -f tfstate 2>/dev/null || true
    preconditions:
      - sh: command -v sops
        msg: "sops not found - enter the nix dev shell first"

  plan:
    desc: tofu plan (automatically handles tfstate.sops). Kubernetes resources were moved out so this no longer needs cluster access.
    cmds:
      - task: _decrypt-state
      # deferred so state is re-encrypted even when tofu exits non-zero
      - defer: { task: _encrypt-state }
      - tofu plan {{.CLI_ARGS | default ""}}
    preconditions: &tf-preconditions
      - sh: command -v tofu
        msg: "tofu not found - enter the nix dev shell first"
      - sh: command -v sops
        msg: "sops not found - enter the nix dev shell first"
      - sh: test -n "$TF_VAR_openbao_token"
        msg: "TF_VAR_openbao_token is empty - enter the nix dev shell / check bao login"
      - sh: test -n "$TF_VAR_admin_ssh_public_key"
        msg: "TF_VAR_admin_ssh_public_key is empty - stale shell? re-enter the dev shell (flake exports it from OpenBao secret/hcloud)"

  apply:
    desc: tofu apply with interactive approval (handles encrypted state)
    cmds:
      - task: _decrypt-state
      # deferred so a half-applied state is re-encrypted even when tofu exits
      # non-zero - otherwise the applied changes are lost on the next decrypt
      - defer: { task: _encrypt-state }
      - tofu apply {{.CLI_ARGS | default ""}}
    preconditions: *tf-preconditions
    prompt: "Run tofu apply? (tfstate.sops will be updated even if apply fails partway)"

  state-pull:
    desc: Force-refresh tfstate.sops from current tofu state (safe anytime)
    cmds:
      - task: _encrypt-state
    preconditions:
      - sh: command -v tofu
        msg: "tofu not found - enter the nix dev shell first"
      - sh: command -v sops
        msg: "sops not found - enter the nix dev shell first"
