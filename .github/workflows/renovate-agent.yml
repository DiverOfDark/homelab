name: Renovate agent

# Phase 1 of the AI update job: triage only. Every night an LLM reads each ready Renovate
# PR (diff, upstream release notes, how the repo uses the dependency, current cluster
# state) and comments a verdict: "safe to auto-merge" or "needs a human". Nothing is
# merged. Prompt, denylist and scripts live in .github/renovate-agent/.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Triage only this PR number"
        default: ""
      force:
        description: "Re-triage PRs that already have a verdict"
        type: boolean
        default: false
      dry_run:
        description: "Do not comment or label; verdicts go to the run summary only"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-agent
  cancel-in-progress: false

jobs:
  # Read-only on every axis: GitHub token (read scopes), cluster (renovate-agent
  # ServiceAccount, see k3s-userapps/github-runner/renovate-agent.yaml) and the agent's
  # tool allowlist (triage.sh). The model reads untrusted release notes, so the job that
  # runs it holds no write credential at all; publishing is a separate job.
  triage:
    name: Triage
    runs-on: renovate-agent
    container: node:24-trixie
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      count: ${{ steps.select.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl_version: v1.37.2
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install gh, jq, kubectl, Claude Code
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gh jq
          curl -fsSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          npm install -g --silent @anthropic-ai/claude-code
          claude --version

      - name: Select PRs
        id: select
        env:
          ONLY_PR: ${{ inputs.pr }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          mkdir -p out
          .github/renovate-agent/select.sh > out/prs.json
          echo "count=$(jq length out/prs.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### PRs selected for triage: $(jq length out/prs.json)"
            jq -r '.[] | "- #\(.number) \(.title)\(if .denylisted then " (denylisted)" else "" end)"' out/prs.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Triage with Claude
        if: steps.select.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RENOVATE_AGENT_MODEL: ${{ vars.RENOVATE_AGENT_MODEL || 'sonnet' }}
          RENOVATE_AGENT_BUDGET_USD: ${{ vars.RENOVATE_AGENT_BUDGET_USD || '5' }}
        run: |
          set -eu
          .github/renovate-agent/triage.sh out/prs.json out/verdicts.json
          {
            echo "### Verdicts"
            echo "| PR | Verdict | Type | Summary |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| #\(.number) | \(.verdict) | \(.update_type) | \(.summary | gsub("[|\r\n]"; " ")) |"' out/verdicts.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        if: steps.select.outputs.count != '0'
        with:
          name: verdicts
          path: out/
          retention-days: 14

  publish:
    name: Publish verdicts
    needs: triage
    if: needs.triage.outputs.count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verdicts
          path: out
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/renovate-agent/publish.sh out/prs.json out/verdicts.json
