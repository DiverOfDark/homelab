apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-build
# gVisor for GitImage builds: handler runsc-build (talos/talconfig.yaml, 20-customization.part)
# is the extension's runsc with file-access-mounts=exclusive, so BuildKit's overlay snapshotter
# works on the build's state emptyDir (copy-up of a memory-mapped lower-layer file needs it).
# Only use it for pods whose volumes nothing outside the pod changes.
handler: runsc-build
overhead:
    podFixed:
        memory: "128Mi"
        cpu: "100m"
