apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitimage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # GitImage: git URL -> image built in-cluster (gVisor) -> pods by digest.
    # https://diverofdark.github.io/gitimage/
    repoURL: ghcr.io/diverofdark/charts
    chart: gitimage
    targetRevision: 0.1.26
    helm:
      releaseName: gitimage
      valuesObject:
        buildPolicy:
          isolation:
            # Each build runs in gVisor (Talos siderolabs/gvisor extension; RuntimeClass in
            # k3s-objects/gvisor-runtime-class.yaml):
            # rootless BuildKit, seccomp/AppArmor unconfined only inside the sandbox.
            # Was Kata until 2026-11-09: Kata sizes the VM as 2Gi + limits but the pod's host
            # cgroup is only limits + overhead, so builds writing big layers ran
            # cloud-hypervisor out of memory (EIO in BuildKit, or the VM OOM-killed). gVisor
            # memory is charged to the pod cgroup directly, and a crier build took ~3 min
            # under runsc vs ~9.5 min for a comparable Kata build.
            mode: runtimeClass
            runtimeClassName: gvisor
        # No registry: images live in Ceph RGW and nodes pull them from gitimage-node on
        # localhost:25050 (containerd allows plain HTTP to localhost without node config).
        storage:
          type: s3
          s3:
            bucket: gitimage
            endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
            secret: gitimage          # created by the ObjectBucketClaim below
            pathStyle: true
        network:
          # Build egress may reach the internet but not pods (10.244/16) or services (10.96/12).
          clusterCIDRs: [10.244.0.0/16, 10.96.0.0/12]
        build:
          # Builds pull base images (FROM node:..., rust:...) through Harbor's Docker Hub
          # proxy cache, not Docker Hub directly (rate limits on the home IP).
          buildkitdConfig: |
            [registry."docker.io"]
              mirrors = ["harbor.kirillorlov.pro/docker-hub"]
        podMonitor:
          enabled: true
        # Status UI: every GitImage, live build logs, workloads and gated pods. Sign-in is
        # end-to-end OIDC like Headlamp: the UI forwards the user's Zitadel id_token to the
        # kube-apiserver, which authorizes it via k3s-objects/oidc-admin-rbac.yaml. It reuses
        # the Headlamp Zitadel client because the API server accepts only that client_id as
        # audience (talos/talconfig.yaml); terraform/zitadel.tf carries the extra redirect URI.
        ui:
          enabled: true
          baseURL: https://gitimage.kirillorlov.pro
          auth:
            mode: oidc
            oidc:
              issuer: https://auth.kirillorlov.pro
              existingSecret: gitimage-ui-oidc   # ExternalSecret below
          ingress:
            enabled: true
            className: traefik
            host: gitimage.kirillorlov.pro
            # Internal-only (no kirillorlov.pro/expose label), same posture as Headlamp.
            annotations:
              cert-manager.io/cluster-issuer: acme-issuer
              hugin.dev/enabled: "true"
              hugin.dev/href: "https://gitimage.kirillorlov.pro"
              hugin.dev/group: Cluster Management
              hugin.dev/name: GitImage
              hugin.dev/description: In-cluster image builds
              hugin.dev/pod-selector: "app.kubernetes.io/component=controller"
            tls:
              - secretName: gitimage-ui-tls
                hosts:
                  - gitimage.kirillorlov.pro
        extraObjects:
          # The Headlamp Zitadel client (secret/zitadel/headlamp-credentials in OpenBao), under
          # the key names the chart reads. No target template: extraObjects go through helm tpl.
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: gitimage-ui-oidc
              namespace: gitimage-system
            spec:
              secretStoreRef:
                name: openbao-store
                kind: ClusterSecretStore
              refreshInterval: "1h"
              target:
                name: gitimage-ui-oidc
                creationPolicy: Owner
              data:
                - secretKey: clientID
                  remoteRef:
                    key: zitadel/headlamp-credentials
                    property: client_id
                - secretKey: clientSecret
                  remoteRef:
                    key: zitadel/headlamp-credentials
                    property: client_secret
          - apiVersion: objectbucket.io/v1alpha1
            kind: ObjectBucketClaim
            metadata:
              name: gitimage
              namespace: gitimage-system
            spec:
              bucketName: gitimage
              storageClassName: ceph-bucket
  destination:
    server: https://kubernetes.default.svc
    namespace: gitimage-system
  # The controller fills in the webhook caBundle at startup.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: gitimage
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        # gitimage-node uses hostNetwork; the isolation check runs BuildKit with unconfined seccomp.
        pod-security.kubernetes.io/enforce: privileged
