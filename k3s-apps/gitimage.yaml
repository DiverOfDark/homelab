apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitimage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # GitImage: git URL -> image built in-cluster (Kata) -> pods by digest.
    # https://diverofdark.github.io/gitimage/
    repoURL: ghcr.io/diverofdark/charts
    chart: gitimage
    targetRevision: 0.1.64
    helm:
      releaseName: gitimage
      valuesObject:
        buildPolicy:
          isolation:
            # Each build runs in its own Kata VM. privilegedInSandbox: rootful BuildKit,
            # privileged inside the guest only - the Talos kata extension sets
            # privileged_without_host_devices = true for the kata handler, so no host devices
            # are passed into the VM. midgard (no Kata) is tainted edge, so builds never land there.
            # gVisor (2026-11-09..21) could not build phos: its overlay cannot copy up a file
            # a process has memory-mapped on a shared volume (ENODEV, apt upgrading libssl),
            # exclusive file access crashes the sandbox on the same operation, and the native
            # snapshotter took 57 min. Kata has a real kernel; its old OOMs were the
            # RuntimeClass overhead (k3s-objects/kata-runtime-class.yaml).
            mode: runtimeClass
            runtimeClassName: kata
            privilegedInSandbox: true
          egress:
            # The Harbor mirror in buildkitdConfig is served by in-cluster Traefik:
            # harbor.kirillorlov.pro is its LoadBalancer IP, which Cilium translates to Traefik
            # pod IPs, and denyClusterCIDRs drops those. Without this rule every base image
            # waited ~2 min on the mirror (load metadata), then came from Docker Hub directly.
            # 8443 is the pods' websecure port (the Service maps 443 to it).
            extraRules:
              - to:
                  - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
                    podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
                ports: [{ port: 8443, protocol: TCP }]
        # No registry: images live in Ceph RGW and nodes pull them from gitimage-node on
        # localhost:25050 (containerd allows plain HTTP to localhost without node config).
        storage:
          type: s3
          s3:
            bucket: gitimage
            endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
            secret: gitimage          # created by the ObjectBucketClaim below
            pathStyle: true
        network:
          # Build egress may reach the internet but not pods (10.244/16) or services (10.96/12).
          clusterCIDRs: [10.244.0.0/16, 10.96.0.0/12]
        build:
          # Talos' Kata extension shares filesystem volumes into the VM over virtiofs without
          # xattr support ("failed to create hash ...: operation not supported"). BuildKit's
          # state goes on a raw block ceph-block PVC instead (virtio-blk in the VM), formatted
          # ext4 by an init container and mounted by BuildKit. phos needs ~15-25G.
          # persistent: one PVC per GitImage (<name>-buildkit), kept between its builds and
          # formatted only once, so BuildKit's local cache and RUN --mount=type=cache survive
          # instead of every build re-downloading its layers from RGW. BuildKit GC keeps each
          # within 80% (32G); RBD is thin, so a small app's PVC uses only what it caches.
          # Reset one: kubectl -n <ns> delete pvc <name>-buildkit.
          stateVolume:
            persistent:
              storageClassName: ceph-block
              size: 40Gi
            block:
              fsType: ext4
              formatImage: harbor.kirillorlov.pro/docker-hub/library/debian:bookworm-slim
            # Only a rebuildable cache: Velero skips them (k3s-apps/velero.yaml resource policy
            # and resource-level exclusion), and a restored one would be replaced anyway.
            labels:
              velero.io/exclude-from-backup: "true"
          # Kata builds are slower than gVisor's were; a cold phos build must fit.
          activeDeadline: 2h
          # Builds pull base images (FROM node:..., rust:...) through Harbor's Docker Hub
          # proxy cache, not Docker Hub directly (rate limits on the home IP).
          # max-parallelism = 1: one build step at a time, across all stages. Multi-stage
          # builds (phos: frontend, Rust chef/backend, Android) otherwise run their stages side
          # by side, multiplying peak CPU and memory inside the build VM.
          buildkitdConfig: |
            [registry."docker.io"]
              mirrors = ["harbor.kirillorlov.pro/docker-hub"]
            [worker.oci]
              max-parallelism = 1
        podMonitor:
          enabled: true
        # Trivy Operator scans the pod template of Deployments/StatefulSets/DaemonSets, not
        # the pods (aquasecurity/trivy-operator#1745), and only pods get the built image. The
        # roller also writes the image into the template, so reports cover what runs. Argo
        # keeps it: the apps ignore fields owned by gitimage-controller.
        controller:
          pinTemplateImage: true
        # Trivy's filesystem mode runs the scanned image itself, in trivy-system
        # (k3s-apps/trivy-operator.yaml); the cross-tenant guard would deny that pod.
        webhook:
          crossTenantNamespaces: [trivy-system]
        # Status UI: every GitImage, live build logs, workloads and gated pods. Sign-in is
        # end-to-end OIDC like Headlamp: the UI forwards the user's Zitadel id_token to the
        # kube-apiserver, which authorizes it via k3s-objects/oidc-admin-rbac.yaml. It reuses
        # the Headlamp Zitadel client because the API server accepts only that client_id as
        # audience (talos/talconfig.yaml); terraform/zitadel.tf carries the extra redirect URI.
        ui:
          enabled: true
          baseURL: https://gitimage.kirillorlov.pro
          auth:
            mode: oidc
            oidc:
              issuer: https://auth.kirillorlov.pro
              existingSecret: gitimage-ui-oidc   # ExternalSecret below
          ingress:
            enabled: true
            className: traefik
            host: gitimage.kirillorlov.pro
            # Internal-only (no kirillorlov.pro/expose label), same posture as Headlamp.
            annotations:
              cert-manager.io/cluster-issuer: acme-issuer
              hugin.dev/enabled: "true"
              hugin.dev/href: "https://gitimage.kirillorlov.pro"
              hugin.dev/group: Cluster Management
              hugin.dev/name: GitImage
              hugin.dev/description: In-cluster image builds
              hugin.dev/pod-selector: "app.kubernetes.io/component=controller"
            tls:
              - secretName: gitimage-ui-tls
                hosts:
                  - gitimage.kirillorlov.pro
        extraObjects:
          # The Headlamp Zitadel client (secret/zitadel/headlamp-credentials in OpenBao), under
          # the key names the chart reads. No target template: extraObjects go through helm tpl.
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: gitimage-ui-oidc
              namespace: gitimage-system
            spec:
              secretStoreRef:
                name: openbao-store
                kind: ClusterSecretStore
              refreshInterval: "1h"
              target:
                name: gitimage-ui-oidc
                creationPolicy: Owner
              data:
                - secretKey: clientID
                  remoteRef:
                    key: zitadel/headlamp-credentials
                    property: client_id
                - secretKey: clientSecret
                  remoteRef:
                    key: zitadel/headlamp-credentials
                    property: client_secret
          - apiVersion: objectbucket.io/v1alpha1
            kind: ObjectBucketClaim
            metadata:
              name: gitimage
              namespace: gitimage-system
            spec:
              bucketName: gitimage
              storageClassName: ceph-bucket
  destination:
    server: https://kubernetes.default.svc
    namespace: gitimage-system
  # The controller fills in the webhook caBundle at startup.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: gitimage
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        # gitimage-node uses hostNetwork; the isolation check runs a privileged-in-VM pod.
        pod-security.kubernetes.io/enforce: privileged
