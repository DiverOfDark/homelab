apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: argocd-apps
  namespace: argocd
spec:
  allowCrossNamespaceImport: true
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 19974
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: argocd-ops
  namespace: argocd
spec:
  allowCrossNamespaceImport: true
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 19993
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "oauth-secret"
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  refreshInterval: "1h"

  target:
    name: oauth-secret
    creationPolicy: 'Owner'
    deletionPolicy: "Retain"
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: zitadel/argocd-credentials
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: zitadel/argocd-credentials
        property: client_secret
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
      - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: argo-helm/argo-cd
      repoURL: ghcr.io/argoproj
      targetRevision: 10.18.2
      helm:
        valuesObject:
            global:
              domain: argo.kirillorlov.pro
              # chart 10 creates NetworkPolicies by default; keep networking as-is
              networkPolicy:
                create: false
              affinity.nodeAffinity.type: soft
        
            server:
              replicas: 2
              ingress:
                enabled: true
                tls: true
                ingressClassName: traefik
                annotations:
                  cert-manager.io/cluster-issuer: acme-issuer
                  hugin.dev/enabled: "true"
                  hugin.dev/href: "https://argo.kirillorlov.pro"
                  hugin.dev/group: Cluster Management
                  hugin.dev/name: ArgoCD
                  hugin.dev/icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/png/argo-cd.png"
                  hugin.dev/pod-selector: "app.kubernetes.io/instance=argocd"
                  hugin.dev/widget.type: argocd
                  hugin.dev/widget.url: http://argocd-server.argocd.svc.cluster.local
                  hugin.dev/widget.key-from-secret: argocd-readonly-token/token
                  # For hugin's widget generator: the full application list is ~2 MB.
                  hugin.dev/widget.hint: "The application list is megabytes. Add the query parameter fields=items.status.sync.status,items.status.health so only sync and health status come back."


              autoscaling:
                enabled: false
                minReplicas: 2
              certificate:
                enabled: false
                issuer:
                  group: cert-manager.io
                  kind: ClusterIssuer
                  name: acme-issuer
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"
        
            redis-ha:
              enabled: false
              haproxy:
                hardAntiAffinity: false
        
        
            configs:
              params:
                server.insecure: true
              rbac:
                policy.csv: "g, readonly, role:readonly"
                policy.default: "role:admin"
              cm:
                admin.enabled: false
                oidc.config: |
                  name: Homelab
                  issuer: https://auth.kirillorlov.pro
                  clientID: $oauth-secret:client-id
                  clientSecret: $oauth-secret:client-secret
                  requestedScopes: ["openid", "profile", "email"]

                exec.enabled: true
                accounts.readonly: apiKey
                application.resourceTrackingMethod: "annotation+label"
                # The chart's default list (argo-cd 10.18.0). Setting this key replaces
                # the default, so compare with the chart's values.yaml when
                # upgrading it.
                resource.exclusions: |
                  ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
                  - apiGroups:
                    - ''
                    - discovery.k8s.io
                    kinds:
                    - Endpoints
                    - EndpointSlice
                  ### Internal Kubernetes resources excluded reduce the number of watched events
                  - apiGroups:
                    - coordination.k8s.io
                    kinds:
                    - Lease
                  ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
                  - apiGroups:
                    - authentication.k8s.io
                    - authorization.k8s.io
                    kinds:
                    - SelfSubjectReview
                    - TokenReview
                    - LocalSubjectAccessReview
                    - SelfSubjectAccessReview
                    - SelfSubjectRulesReview
                    - SubjectAccessReview
                  ### Intermediate Certificate Request excluded reduce the number of watched events
                  - apiGroups:
                    - certificates.k8s.io
                    kinds:
                    - CertificateSigningRequest
                  - apiGroups:
                    - cert-manager.io
                    kinds:
                    - CertificateRequest
                  ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
                  - apiGroups:
                    - cilium.io
                    kinds:
                    - CiliumIdentity
                    - CiliumEndpoint
                    - CiliumEndpointSlice
                  ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
                  - apiGroups:
                    - kyverno.io
                    - reports.kyverno.io
                    - wgpolicyk8s.io
                    kinds:
                    - PolicyReport
                    - ClusterPolicyReport
                    - EphemeralReport
                    - ClusterEphemeralReport
                    - AdmissionReport
                    - ClusterAdmissionReport
                    - BackgroundScanReport
                    - ClusterBackgroundScanReport
                    - UpdateRequest
                # Trivy Operator reports (k3s-apps/trivy-operator.yaml) are owned by the
                # workload they scan, so they show up under it in every app tree. The
                # health message carries the counts; any CRITICAL finding marks the report
                # Degraded. Child health doesn't roll up into the application's health.
                resource.customizations.health.aquasecurity.github.io_VulnerabilityReport: &trivyReportHealth |
                  hs = {}
                  local s = obj.report and obj.report.summary
                  if s == nil then
                    hs.status = "Progressing"
                    hs.message = "Waiting for scan"
                    return hs
                  end
                  local c = s.criticalCount or 0
                  local h = s.highCount or 0
                  local m = s.mediumCount or 0
                  hs.message = "critical " .. c .. ", high " .. h .. ", medium " .. m
                  if c > 0 then
                    hs.status = "Degraded"
                  else
                    hs.status = "Healthy"
                  end
                  return hs
                resource.customizations.health.aquasecurity.github.io_ConfigAuditReport: *trivyReportHealth
                resource.customizations.health.aquasecurity.github.io_ExposedSecretReport: *trivyReportHealth
                resource.customizations.ignoreDifferences.PersistentVolumeClaim: |
                  jqPathExpressions:
                    - '.spec.volumeName'
                    - '.metadata.finalizers'
                    - '.metadata.annotations'
                resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
                  jqPathExpressions:
                    - '.webhooks[]?.clientConfig.caBundle'
                resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
                  jqPathExpressions:
                    - '.spec.data[]?.remoteRef.conversionStrategy'
                    - '.spec.data[]?.remoteRef.decodingStrategy'
                    - '.spec.data[]?.remoteRef.metadataPolicy'
                    - '.spec.data[]?.remoteRef.nullBytePolicy'
                    - '.spec.target.template.engineVersion'
                    - '.spec.target.template.mergePolicy'
                resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
                  jqPathExpressions:
                    - '.spec.conversion'
                resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
                  jqPathExpressions:
                    - '.spec.admission'
                    - '.spec.background'
                    - '.spec.emitWarning'
                    - '.spec.validationFailureAction'
                    - '.spec.rules[]?.skipBackgroundRequests'
            dex:
              enabled: false
        
            controller:
              replicas: 2
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"
        
            repoServer:
              autoscaling:
                enabled: false
                minReplicas: 2
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"
        
            applicationSet:
              replicas: 2
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"
          
            
            notifications:
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"
          
            redis:
              exporter:
                enabled: "true"
            
              metrics:
                enabled: "true"
                serviceMonitor:
                  enabled: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
