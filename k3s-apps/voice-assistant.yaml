apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voice-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: voice-assistant
    server: https://kubernetes.default.svc
  project: default
  source:
    # Femto voice backend (OpenAI speech-to-speech + Hermes) — Helm chart lives
    # in the stackchan repo.
    repoURL: https://github.com/DiverOfDark/stackchan.git
    # `deploy` moves only after CI built and pushed that commit's image, so a
    # red build is never deployed (it would sit in ImagePullBackOff).
    targetRevision: deploy
    path: backend/chart
    helm:
      releaseName: voice-assistant
      parameters:
        - name: image.repository
          value: ghcr.io/diverofdark/stackchan-voice
        - name: image.tag
          value: sha-$ARGOCD_APP_REVISION_SHORT
      valuesObject:
        # Hermes, the agent the voice model delegates to, runs on a KubeVirt VM
        # in this cluster. The OpenAI key defaults to trackhound's in OpenBao.
        hermes:
          baseUrl: http://hermes-api.kubevirt-vms.svc.cluster.local:8642/v1
          model: hermes-agent
          apiKey:
            externalSecret:
              enabled: true
              store: openbao-store
              storeKind: ClusterSecretStore
              refreshInterval: "1h"
              remoteKey: voice-assistant/hermes
              property: api_key
        # Femto's voice: made from the description below with OpenAI's
        # POST /v1/audio/voices (cold, slow, deep; Russian). To change it, create
        # a new voice and replace both values.
        openai:
          liveVoice: voice_6af9af724050819195da94d8241168cd
          liveVoicePrompt: >-
            An adult male voice, around fifty, deep baritone with a smooth, dark, resonant
            timbre. Speaks slowly and deliberately in a flat, cold, emotionless monotone,
            with crisp over-precise articulation, slightly drawn-out words and long menacing
            pauses between phrases. Quiet, controlled, never raised. Sounds like a sinister
            government agent in a suit: polite on the surface, condescending and faintly
            contemptuous underneath. Speaks Russian natively with a neutral Moscow accent.
        # Femto StackChan: live Claude usage for the butler persona, from
        # trmnl-cyberpunk's /api/stackchan/usage.
        stackchan:
          usageUrl: https://trmnl.kirillorlov.pro
        ingress:
          enabled: true
          className: traefik
          host: voice-assistant.kirillorlov.pro
          annotations:
            cert-manager.io/cluster-issuer: acme-issuer
            hugin.dev/enabled: "true"
            hugin.dev/href: "https://voice-assistant.kirillorlov.pro"
            hugin.dev/group: Apps
            hugin.dev/name: Voice Assistant
          tls:
            enabled: true
        # Pin to asgard — matches the
        # repo's nodeSelector pattern (k3s-userapps/github-runner/shared-dind.yaml).
        # asgard is untainted, so no tolerations needed.
        nodeSelector:
          kubernetes.io/hostname: asgard
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
