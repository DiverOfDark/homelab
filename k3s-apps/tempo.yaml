apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 3.1.0
    helm:
      valuesObject:
        tempo:
          retention: 24h
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
        # top-level key (it was nested under `tempo:`, where the chart ignores it,
        # so traces lived on the container filesystem)
        persistence:
          enabled: true
          storageClassName: ceph-block
          size: 10Gi
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
