apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    targetRevision: 0.30.6
    chart: openbao
    helm:
      valuesObject:
        server:
          updateStrategyType: "RollingUpdate"
          podManagementPolicy: "Parallel"
          volumes:
            - name: seal-key
              secret:
                secretName: openbao-seal-key
          volumeMounts:
            - name: seal-key
              mountPath: /openbao/seal
              readOnly: true
          ingress:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: acme-issuer
              hugin.dev/enabled: "true"
              hugin.dev/href: "https://openbao.kirillorlov.pro"
              hugin.dev/group: Cluster Management
              hugin.dev/name: OpenBao
              hugin.dev/icon: openbao.svg
              hugin.dev/pod-selector: "app.kubernetes.io/name=openbao"
              hugin.dev/widget.type: "openbao"
              hugin.dev/widget.url: "http://openbao.openbao.svc.cluster.local:8200"
              hugin.dev/widget.hint: "No token is available. Use the unauthenticated /v1/sys/health (it answers with non-200 codes for sealed or standby, which is not an error) and /v1/sys/seal-status: show Sealed yes/no, version, and unseal progress or key threshold."
            ingressClassName: traefik
            hosts:
              - host: openbao.kirillorlov.pro
                paths: [ ]
            tls:
              - secretName: openbao-tls
                hosts:
                  - openbao.kirillorlov.pro
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: "ceph-filesystem"
          ha:
            enabled: true
            raft:
              enabled: true
              setNodeId: true

              config: |
                ui = true
                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  telemetry {
                    unauthenticated_metrics_access = "true"
                  }
                }
                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }
                storage "raft" {
                  path = "/openbao/data"
                }
                service_registration "kubernetes" {}
                seal "static" {
                  current_key_id = "initial"
                  current_key    = "file:///openbao/seal/key"
                }
        ui:
          enabled: true
          serviceType: "ClusterIP"
        injector:
          enabled: false
        serverTelemetry:
          serviceMonitor:
            enabled: true
          prometheusRules:
            enabled: true
          grafanaDashboard:
            enabled: true
        extraObjects:
        - apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: openbao-store
          spec:
            provider:
              vault:
                server: "http://openbao-active.openbao.svc.cluster.local:8200"
                path: "secret"
                # Version is the Vault KV secret engine version. This can be either "v1" or
                # "v2". Version default is "v2".
                version: "v2"
                auth:
                  kubernetes:
                    mountPath: "kubernetes"
                    role: "eso-role"
                    serviceAccountRef:
                      name: "eso-external-secrets"
                      namespace: "eso"


  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
