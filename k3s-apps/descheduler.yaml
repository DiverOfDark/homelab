apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: descheduler
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    targetRevision: 0.36.0
    helm:
      valuesObject:
        kind: Deployment
        deschedulingInterval: 10m
        replicas: 1
        service:
          enabled: true
        serviceMonitor:
          enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        deschedulerPolicy:
          # Keep evictions gentle: at most a couple of pods per node per
          # 10m cycle so rebalancing doesn't turn into a restart storm.
          maxNoOfPodsToEvictPerNode: 2
          profiles:
            - name: default
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    # Only evict a pod if it actually fits on another node,
                    # otherwise pinned pods (rook OSDs, midgard edge pods)
                    # would just restart in place.
                    nodeFit: true
                    podProtections:
                      # emptyDir-only pods are safe to move; PVC pods must
                      # stay evictable too or Ceph-backed workloads (most of
                      # the memory-heavy ones) could never be rebalanced.
                      defaultDisabled:
                        - "PodsWithLocalStorage"
                - name: RemoveDuplicates
                - name: RemovePodsHavingTooManyRestarts
                  args:
                    podRestartThreshold: 100
                    includingInitContainers: true
                - name: RemovePodsViolatingNodeAffinity
                  args:
                    nodeAffinityType:
                      - requiredDuringSchedulingIgnoredDuringExecution
                - name: RemovePodsViolatingNodeTaints
                - name: RemovePodsViolatingInterPodAntiAffinity
                - name: RemovePodsViolatingTopologySpreadConstraint
                - name: LowNodeUtilization
                  args:
                    # Percent of allocatable *requests*. asgard (12c/64Gi)
                    # idles at ~27% cpu / ~67% mem while the 4c/16Gi nodes
                    # sit at ~90%+, so: below both thresholds = source of
                    # spare capacity, above either target = drain candidate.
                    thresholds:
                      cpu: 40
                      memory: 70
                    targetThresholds:
                      cpu: 90
                      memory: 85
                    evictableNamespaces:
                      exclude:
                        - rook-ceph
              plugins:
                balance:
                  enabled:
                    - RemoveDuplicates
                    - RemovePodsViolatingTopologySpreadConstraint
                    - LowNodeUtilization
                deschedule:
                  enabled:
                    - RemovePodsHavingTooManyRestarts
                    - RemovePodsViolatingNodeTaints
                    - RemovePodsViolatingNodeAffinity
                    - RemovePodsViolatingInterPodAntiAffinity
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
