apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: userapps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/DiverOfDark/homelab.git
        revision: HEAD
        directories:
          - path: k3s-userapps/*
  template:
    metadata:
      name: "{{path.basename}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: "{{path.basename}}"
        server: https://kubernetes.default.svc
      project: default
      source:
        path: "k3s-userapps/{{path.basename}}"
        repoURL: https://github.com/DiverOfDark/homelab.git
        targetRevision: HEAD
      ignoreDifferences:
        # GitImage pins gitimage.dev/revision.<container> in pod templates on every new commit
        # (server-side apply, field manager gitimage-controller); that is a rollout, not drift.
        - group: apps
          kind: Deployment
          managedFieldsManagers: [gitimage-controller]
        - group: apps
          kind: StatefulSet
          managedFieldsManagers: [gitimage-controller]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - '.spec.conversion'
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: cdis.cdi.kubevirt.io
          jqPathExpressions:
            - '.spec.versions'
        - group: kubevirt.io
          kind: VirtualMachine
          jqPathExpressions:
            - '.spec.template.spec.domain.firmware'
            - '.spec.dataVolumeTemplates[]?.metadata.creationTimestamp'
      syncPolicy:
        automated:
          prune: true
        syncOptions:
        - PruneLast=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - CreateNamespace=true