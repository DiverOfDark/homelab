apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Pull the helm chart straight from the source repo's master branch.
    # The chart lives at helm/phos and moves in lockstep with the Rust code
    # that produces the image, so chart-version drift and image-version
    # drift can't diverge.
    repoURL: https://github.com/DiverOfDark/phos.git
    targetRevision: master
    path: helm/phos
    helm:
      valuesObject:
        # GitImage (defined in extraObjects below) builds the image from this repo's
        # master branch; its webhook swaps in the built digest and rolls the
        # Deployment on each new build. There is deliberately no per-commit
        # image.tag: a template that changed on every commit would make Argo roll
        # (Recreate) before the build exists, which is how phos went down twice.
        podAnnotations:
          gitimage.dev/image.phos: phos

        # hugin's pod-selector annotation expects this exact label.
        podLabels:
          app.kubernetes.io/pod: phos

        persistence:
          # Adopts the pre-chart PVC (created 2026-03 by the old
          # k3s-userapps/phos manifests) — annotated Delete=false so it
          # survives app churn.
          size: 50Gi
          storageClassName: ceph-block

        nodeSelector:
          kubernetes.io/hostname: asgard

        phos:
          comfyuiUrl: "http://192.168.178.126:8188"

        oidc:
          issuer: "https://auth.kirillorlov.pro"
          externalSecret:
            enabled: true
            store: openbao-store
            storeKind: ClusterSecretStore

        ingress:
          enabled: true
          host: phos.kirillorlov.pro
          annotations:
            cert-manager.io/cluster-issuer: acme-issuer
            hugin.dev/enabled: "true"
            hugin.dev/href: "https://phos.kirillorlov.pro"
            hugin.dev/group: Apps
            hugin.dev/name: Phos
            hugin.dev/pod-selector: "app.kubernetes.io/pod=phos"
            hugin.dev/description: "AI-Powered Photo Manager"
          tls:
            - hosts:
                - phos.kirillorlov.pro
              secretName: phos-tls

        extraObjects:
          # OpenBao: secret/phos/android-keystore holds `password` for
          # android/phos-release.keystore (copied from the GitHub secret
          # KEYSTORE_PASSWORD on 2026-11-20). Without it the APK is unsigned and
          # every installed app refuses the in-app update.
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: phos-android-keystore
            spec:
              secretStoreRef:
                name: openbao-store
                kind: ClusterSecretStore
              refreshInterval: 1h
              target:
                name: phos-android-keystore
                creationPolicy: Owner
                deletionPolicy: Retain
              data:
                - secretKey: password
                  remoteRef:
                    key: phos/android-keystore
                    property: password

          # phos is built in-cluster from github.com/DiverOfDark/phos.
          # GitImage builds every commit on master (Kata, BuildKit) into Ceph RGW,
          # and the Deployment runs it by digest (podAnnotations above). The Android
          # versionCode comes from GITIMAGE_COMMIT_TIME (see the Dockerfile's
          # `version` stage); PHOS_VERSION is the branch, so the versionName is
          # `master+<short sha>`, as from GitHub CI.
          - apiVersion: gitimage.dev/v1alpha1
            kind: GitImage
            metadata:
              name: phos
            spec:
              url: https://github.com/DiverOfDark/phos.git
              ref: master
              interval: 2m
              build:
                args:
                  PHOS_VERSION: { value: master }
                  # SHA-256 of the release signing certificate (android/phos-release.keystore,
                  # alias phos). The build fails unless the APK is signed by exactly this
                  # certificate: an unsigned APK - e.g. the keystore secret arriving empty -
                  # would make every installed app refuse the update, silently.
                  PHOS_SIGNING_CERT_SHA256: { value: 0dcc95bbf650f9e8828ee2a5f1759bf0a2acd42a09a99be8b51b3a0b9dd37059 }
                secrets:
                  - id: keystore_password
                    secretRef: { name: phos-android-keystore, key: password }
                # Rust (with a from-source ffmpeg), Vue and a Gradle Android build in
                # parallel stages. More than 4 CPUs requested, so only asgard fits;
                # the cold build must finish inside the cluster's 1h activeDeadline.
                resources:
                  requests: { cpu: "6", memory: 8Gi }
                  limits: { cpu: "10", memory: 20Gi }

  destination:
    server: https://kubernetes.default.svc
    namespace: phos
  # GitImage's roller pins gitimage.dev/revision.* on the Deployment (field
  # manager gitimage-controller); Argo must not revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      managedFieldsManagers: [gitimage-controller]
  syncPolicy:
    automated:
      prune: true
    # GitImage builds run in this namespace in a Kata VM with BuildKit privileged inside
    # the guest (privilegedInSandbox), which the cluster's default baseline level rejects.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
