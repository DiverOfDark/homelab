apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # The status page at status.kirillorlov.pro. Rust replacement for
    # gethomepage; it reads the same gethomepage.dev/* Ingress annotations.
    # The chart lives next to the code that builds the image, so both move
    # together. The GitImage below builds every commit on master in-cluster
    # and its webhook swaps the container image for the built digest; the
    # ghcr tag is only what the pod template names before that swap.
    repoURL: https://github.com/DiverOfDark/hugin.git
    targetRevision: master
    path: charts/hugin
    helm:
      valuesObject:
        image:
          repository: ghcr.io/diverofdark/hugin
          tag: sha-5b96dc5
          pullPolicy: IfNotPresent

        # The status page belongs on the edge: it must stay up (and reachable at
        # status.kirillorlov.pro) precisely when the homelab is broken. The image
        # comes from ghcr, not from the in-cluster registry, for the same reason.
        nodeSelector:
          kirillorlov.pro/edge: "true"
        tolerations:
          - key: "edge"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"

        # GitImage (defined below) builds the image from the hugin repo's master;
        # its webhook swaps the container image for the built digest and rolls
        # the Deployment on each new build. pullPolicy stays IfNotPresent so a
        # restart on midgard does not need the registry at home.
        podAnnotations:
          gitimage.dev/image.hugin: hugin

        # Writes a Widget (Lua script) for every service annotated
        # gethomepage.dev/widget.type: auto, using a language model, and
        # validates it against the live service before storing it. Runs at
        # home, not on the edge: the status page itself never needs it.
        generator:
          enabled: true
          model: gpt-5-mini
          reasoningEffort: medium
          apiKeySecret:
            name: hugin-ai
            key: OPENAI_API_KEY
          podAnnotations:
            gitimage.dev/image.hugin: hugin
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi

        additionalObjects:
          # The OpenAI key is shared with trackhound and crier.
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: hugin-ai
            spec:
              secretStoreRef:
                name: openbao-store
                kind: ClusterSecretStore
              refreshInterval: 1h
              target:
                name: hugin-ai
                creationPolicy: Owner
                deletionPolicy: Retain
              data:
                - secretKey: OPENAI_API_KEY
                  remoteRef:
                    key: trackhound
                    property: openai_api_key

          - apiVersion: gitimage.dev/v1alpha1
            kind: GitImage
            metadata:
              name: hugin
            spec:
              url: https://github.com/DiverOfDark/hugin.git
              ref: master
              interval: 2m
              build:
                # Rust release build; Kata sizes the VM from the limits.
                resources:
                  requests: { cpu: "2", memory: 2Gi }
                  limits: { cpu: "4", memory: 6Gi }

        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi

        podMonitor:
          enabled: true

        ingress:
          enabled: true
          className: traefik
          labels:
            # Kyverno generates a hugin-external twin on the traefik-external
            # class (see k3s-objects/external-ingress-policy.yaml), which is
            # where status.kirillorlov.pro is served from.
            kirillorlov.pro/expose: external
          annotations:
            cert-manager.io/cluster-issuer: acme-issuer
            gethomepage.dev/enabled: "true"
            gethomepage.dev/href: "https://status.kirillorlov.pro"
            gethomepage.dev/group: Infra
            gethomepage.dev/name: Status Page
            gethomepage.dev/icon: homepage.png
            gethomepage.dev/description: this page
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=hugin"
          hosts:
            - host: status.kirillorlov.pro
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - status.kirillorlov.pro
              secretName: status-tls

        # Secrets the dashboard may `get`, by name. Everything else stays
        # unreadable: there is no list/watch on Secrets anywhere.
        # Keep in sync with the hugin.dev/widget.*-from-secret annotations.
        secretAccess:
          - namespace: argocd
            names: [argocd-readonly-token]
          - namespace: media
            names: [plex-secret]
          - namespace: nextcloud
            names: [nextcloud-secret]
          - namespace: paperless
            names: [paperless-secret]
          - namespace: prometheus
            names: [grafana-admin-credentials]

        config:
          title: Kirill Orlov HomeLab
          columns: 5
          showStats: true
          discovery:
            ingress: true
            # The Ceph dashboard is annotated on its IngressRoute.
            traefikIngressRoutes: true
          header:
            cluster:
              show: true
              label: cluster
            nodes:
              show: true
            weather:
              label: Berlin
              latitude: 52.50
              longitude: 13.33
              timezone: Europe/Berlin
              units: metric
              cacheMinutes: 10
              maximumFractionDigits: 1
            search:
              provider: google
              target: _blank
          bookmarks:
            - group: Developer
              items:
                - name: Github
                  abbr: GH
                  href: https://github.com/
          services:
            - group: Infra
              name: FritzBox
              href: http://192.168.178.1/
              icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/avm-fritzbox.svg
              widget:
                type: fritzbox
                params:
                  url: http://192.168.178.1/
            - group: Infra
              name: Pihole
              href: http://192.168.178.2/
              icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/pi-hole.svg
              description: DNS Adblocker
              widget:
                type: pihole
                params:
                  url: http://192.168.178.2
                  version: "6"
            - group: Infra
              name: Garage
              href: http://yggdrasil.ts.kirillorlov.pro:3902/
              icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/garage.svg
              description: Backup storage

  destination:
    server: https://kubernetes.default.svc
    namespace: hugin
  # GitImage's roller pins gitimage.dev/revision.* on the Deployment (field manager
  # gitimage-controller); Argo must not revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      managedFieldsManagers: [gitimage-controller]
  syncPolicy:
    automated:
      prune: true
    # GitImage builds run in this namespace in Kata with BuildKit privileged inside the VM
    # (privilegedInSandbox), which the cluster's default baseline level rejects.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
