apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trackhound
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Pull the helm chart straight from the source repo's master branch.
    # The chart lives at charts/trackhound and moves in lockstep with
    # the Rust code that produces the image, so chart-version drift and
    # image-version drift can't diverge.
    repoURL: https://github.com/DiverOfDark/trackhound.git
    targetRevision: master
    path: charts/trackhound
    helm:
      valuesObject:
        image:
          repository: ghcr.io/diverofdark/trackhound
          pullPolicy: IfNotPresent

        # GitImage (defined below) builds the image from this repo's tracked
        # branch; its webhook swaps the container image for the built digest and
        # rolls the Deployment on each new build.
        podAnnotations:
          gitimage.dev/image.trackhound: trackhound

        persistence:
          enabled: true
          size: 1Gi
          storageClass: ceph-block
          accessModes:
            - ReadWriteOnce

        config:
          bindAddr: 0.0.0.0:8080
          databaseUrl: sqlite:///data/trackhound.sqlite
          gmailScanIntervalSeconds: 1800
          track17SyncIntervalSeconds: 3600
          gmailQuery: "newer_than:14d (shipment OR tracking OR package OR parcel OR delivery OR amazon OR dhl OR dpd OR ups OR fedex OR gls)"
          openaiModel: gpt-5-nano
          openaiUrl: https://api.openai.com/v1/chat/completions
          gmailImapHost: imap.gmail.com
          gmailImapPort: 993
          gmailImapUsername: diverofdark@gmail.com
          gmailImapMailbox: INBOX

        # Pull every secret from OpenBao via external-secrets-operator. The
        # ExternalSecret produces a plain Secret named "trackhound" which
        # the deployment consumes via secretKeyRef.
        secrets:
          existingSecret: trackhound

        # The chart's built-in ingress template doesn't render a `tls:`
        # block, so we disable it and emit our own Ingress (with TLS) via
        # additionalObjects below.
        ingress:
          enabled: false

        additionalObjects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: trackhound
            spec:
              secretStoreRef:
                name: openbao-store
                kind: ClusterSecretStore
              refreshInterval: 1h
              target:
                name: trackhound
                creationPolicy: Owner
                deletionPolicy: Retain
              data:
                - secretKey: OPENAI_API_KEY
                  remoteRef:
                    key: trackhound
                    property: openai_api_key
                - secretKey: GMAIL_IMAP_PASSWORD
                  remoteRef:
                    key: trackhound
                    property: gmail_imap_password
                - secretKey: TRACK17_SECURITY_KEY
                  remoteRef:
                    key: trackhound
                    property: track17_security_key

          # trackhound is built in-cluster from github.com/DiverOfDark/trackhound.
          # Phase A: GitImage builds every commit on master (Kata, BuildKit) into Ceph RGW.
          # The Deployment still runs the ghcr image until it is switched to this build.
          - apiVersion: gitimage.dev/v1alpha1
            kind: GitImage
            metadata:
              name: trackhound
            spec:
              url: https://github.com/DiverOfDark/trackhound.git
              ref: master
              interval: 2m
              build:
                # Rust release builds; Kata sizes the VM from the limits.
                resources:
                  requests: { cpu: "2", memory: 2Gi }
                  limits: { cpu: "4", memory: 6Gi }

          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: trackhound
              annotations:
                cert-manager.io/cluster-issuer: acme-issuer
                gethomepage.dev/enabled: "true"
                gethomepage.dev/href: "https://trackhound.kirillorlov.pro/api-docs"
                gethomepage.dev/group: Apps
                gethomepage.dev/name: Trackhound
                gethomepage.dev/icon: mdi-package-variant-closed
                gethomepage.dev/description: "Gmail parcel tracker with 17TRACK sync"
                # No hand-written widget: hugin's generator writes one for the
                # image and stores it as a Widget resource in the hugin namespace.
                gethomepage.dev/widget.type: auto
                gethomepage.dev/widget.url: http://trackhound-trackhound.trackhound.svc.cluster.local:8080
                gethomepage.dev/widget.hint: "parcels in transit and delivered recently"
            spec:
              rules:
                - host: trackhound.kirillorlov.pro
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: trackhound-trackhound
                            port:
                              name: http
              tls:
                - hosts:
                    - trackhound.kirillorlov.pro
                  secretName: trackhound-tls

        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: trackhound
  # GitImage's roller pins gitimage.dev/revision.* on the Deployment (field manager
  # gitimage-controller); Argo must not revert it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      managedFieldsManagers: [gitimage-controller]
  syncPolicy:
    automated:
      prune: true
    # GitImage builds run in this namespace in Kata with BuildKit privileged inside the VM
    # (privilegedInSandbox), which the cluster's default baseline level rejects.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
