apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/pod: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: homepage
      annotations:
        # Container "homepage" runs GitImage "about"; the webhook writes the built digest
        # (localhost:25050/homepage/about@sha256:...) and new commits roll this Deployment.
        gitimage.dev/image.homepage: about
    spec:
      # Public website — runs on the Hetzner edge (midgard), not the homelab:
      # keeps kirillorlov.pro serving even when home is down/rebooting.
      nodeSelector:
        kirillorlov.pro/edge: "true"
      tolerations:
        - key: "edge"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - image: placeholder
          # Digest refs never change. IfNotPresent keeps restarts on midgard independent of
          # home: with Always, every restart would re-resolve via gitimage-node -> Ceph RGW
          # at home, so a restart while home is down would fail.
          imagePullPolicy: IfNotPresent
          name: homepage
          ports:
            - containerPort: 3000
              protocol: TCP
              name: "http"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
