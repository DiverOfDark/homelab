apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actualbudget
  namespace: actualbudget
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: actualbudget
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        password: "{{ .password }}"
        apikey: "{{ .apikey }}"
        syncid: "{{ .syncid }}"
  data:
    - secretKey: password
      remoteRef:
        key: actualbudget
        property: password
    - secretKey: apikey
      remoteRef:
        key: pihole
        property: password
    # Budget sync id (the "Sync ID" in Actual's Advanced settings). Only used by
    # actualbudget-api's liveness probe, which must hit a budget-scoped route to
    # exercise a real sync -- see deployment.yaml.
    - secretKey: syncid
      remoteRef:
        key: trmnl-cyberpunk
        property: actualbudget_syncid
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actualbudget-zitadel
  namespace: actualbudget
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: actualbudget-zitadel
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: zitadel/actual_budget-credentials
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: zitadel/actual_budget-credentials
        property: client_secret