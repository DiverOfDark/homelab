apiVersion: apps/v1
kind: Deployment
metadata:
  name: actualbudget
  namespace: actualbudget
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/pod: actualbudget
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: actualbudget
        app.kubernetes.io/name: actualbudget
    spec:
      volumes:
        - name: actualbudget
          persistentVolumeClaim:
            claimName: actualbudget
      containers:
        # Version must stay identical to actualbudget-api below: the API image bundles
        # @actual-app/api, which keeps a local SQLite replica and applies this server's
        # sync messages against it. A lagging client fails with SyncError: invalid-schema.
        # Renovate pegs this tag to jhonderson/actual-http-api's release feed (see renovate.json).
        # renovate: datasource=docker depName=jhonderson/actual-http-api
        - image: 'actualbudget/actual-server:26.7.0'
          imagePullPolicy: IfNotPresent
          name: actualbudget
          env:
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: "https://auth.kirillorlov.pro/.well-known/openid-configuration"
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actualbudget-zitadel
                  key: client_id
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actualbudget-zitadel
                  key: client_secret
            - name: ACTUAL_OPENID_PROVIDER_NAME
              value: "Homelab"
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: "https://money.kirillorlov.pro"
          ports:
            - containerPort: 5006
              protocol: TCP
              name: "http"
          volumeMounts:
            - mountPath: /data
              name: actualbudget
          livenessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actualbudget-api
  namespace: actualbudget
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/pod: actualbudget-api
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: actualbudget-api
        app.kubernetes.io/name: actualbudget
    spec:
      containers:
        # Keep in lockstep with actualbudget/actual-server above.
        - image: 'jhonderson/actual-http-api:26.7.0'
          imagePullPolicy: IfNotPresent
          name: actualbudget-api
          env:
            - name: ACTUAL_SERVER_URL
              value: "http://actualbudget.actualbudget.svc.cluster.local/"
            - name: ACTUAL_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: actualbudget
                  key: password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: actualbudget
                  key: apikey
            - name: BUDGET_SYNC_ID
              valueFrom:
                secretKeyRef:
                  name: actualbudget
                  key: syncid
          ports:
            - containerPort: 5007
              protocol: TCP
              name: "http"
          # The process caches one @actual-app/api client (and its actual-server
          # session token) and recycles it on an hourly timer. If the shutdown()
          # in that timer throws -- which it does once the cached token stops being
          # accepted -- the client is never nulled out, so every later sync fails
          # with `PostError: unauthorized` forever while the process stays healthy.
          # /api-docs keeps returning 200 through all of that, so liveness has to
          # hit a budget-scoped route instead: those open the budget and run a real
          # sync, and answer 500 when the cached session is dead. A restart re-inits
          # the client with a fresh login, which is the only known recovery.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'wget -q -O /dev/null --header="x-api-key: $API_KEY" "http://127.0.0.1:5007/v1/budgets/$BUDGET_SYNC_ID/accounts"'
            initialDelaySeconds: 90
            # Each probe reloads the budget and syncs, so keep it infrequent;
            # two failures (~10 min) before restarting rides out server blips.
            periodSeconds: 300
            timeoutSeconds: 60
            successThreshold: 1
            failureThreshold: 2
          # Readiness stays cheap: a slow sync should not pull the pod out of the
          # Service, only a persistently broken client should restart it.
          readinessProbe:
            httpGet:
              path: /api-docs
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
