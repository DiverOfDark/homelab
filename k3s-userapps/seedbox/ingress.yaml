apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    hugin.dev/enabled: "true"
    hugin.dev/href: "https://seedbox.kirillorlov.pro"
    hugin.dev/group: Media
    hugin.dev/name: ruTorrent
    hugin.dev/icon: rutorrent.png
    hugin.dev/pod-selector: "app.kubernetes.io/pod=caddy"
    hugin.dev/widget.type: rutorrent
    hugin.dev/widget.url: http://caddy.seedbox.svc.cluster.local/rutorrent/
  name: seedbox
  namespace: seedbox
spec:
  rules:
  - host: seedbox.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: caddy
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - seedbox.kirillorlov.pro
    secretName: seedbox-tls