apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    hugin.dev/enabled: "true"
    hugin.dev/href: "https://vaultwarden.kirillorlov.pro"
    hugin.dev/group: "Infra"
    hugin.dev/name: vaultwarden
    hugin.dev/pod-selector: "app.kubernetes.io/pod=vaultwarden"
    hugin.dev/icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/vaultwarden.svg"
  name: vaultwarden
  namespace: vaultwarden
  labels:
    kirillorlov.pro/expose: external
spec:
  rules:
  - host: vaultwarden.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: vaultwarden
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - vaultwarden.kirillorlov.pro
    secretName: vaultwarden-tls
