# Local admin account. The password is generated once by ESO and never
# rotated (refreshPolicy: CreatedOnce). The init container in the Deployment
# creates the user, or resets its password to this value if it already
# exists, so a regenerated Secret can never lock you out.
#
#   kubectl -n forgejo get secret forgejo-admin -o jsonpath='{.data.password}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: forgejo-admin-password
  namespace: forgejo
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshPolicy: CreatedOnce
  target:
    name: forgejo-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        username: gitadmin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-admin-password
---
# GitHub read tokens for the mirror job, one per GitHub owner. Each property
# of the OpenBao secret becomes one file in /tokens; the property name is the
# GitHub user or organization to mirror, the value a token that can read its
# private repositories:
#
#   bao kv put secret/forgejo/github-tokens DiverOfDark=github_pat_... appbahn=github_pat_...
#
# Fine-grained PATs are scoped to a single owner, hence one per owner.
# Permissions: Repository access "All repositories", Contents: Read-only
# (Metadata: Read-only is added automatically).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-github-tokens
  namespace: forgejo
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: forgejo-github-tokens
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: forgejo/github-tokens
