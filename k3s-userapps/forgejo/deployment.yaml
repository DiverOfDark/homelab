# Forgejo as a read-only pull mirror of GitHub. GitHub stays the primary;
# the mirror-sync CronJob creates one pull mirror per GitHub repository and
# Forgejo refreshes each of them every hour.
#
# All settings come from GITEA__<section>__<KEY> variables, which the image
# entrypoint writes into /var/lib/gitea/custom/conf/app.ini on every start.
# A dot in a section name is spelled _0X2E_.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    # Restart when the Zitadel client secret first appears or rotates.
    reloader.stakater.com/auto: "true"
spec:
  # Single replica on an RWO volume with SQLite: never run two at once.
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/pod: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: forgejo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: {}
      initContainers:
        # Runs the image entrypoint (which renders app.ini from the env
        # below), migrates the database, makes sure the admin account exists
        # with the password from the forgejo-admin Secret, then creates or
        # updates the "zitadel" login source once tofu has published the
        # OIDC client to OpenBao.
        - name: bootstrap
          image: 'codeberg.org/forgejo/forgejo:17.0.1-rootless'
          imagePullPolicy: IfNotPresent
          args:
            - sh
            - -ec
            - |
              forgejo migrate
              if forgejo admin user list --admin | awk 'NR > 1 { print $2 }' | grep -qx "$ADMIN_USER"; then
                forgejo admin user change-password --username "$ADMIN_USER" --password "$ADMIN_PASSWORD" --must-change-password=false
              else
                forgejo admin user create --admin --username "$ADMIN_USER" --password "$ADMIN_PASSWORD" \
                  --email "$ADMIN_USER@git.kirillorlov.pro" --must-change-password=false
              fi
              if [ -z "${OIDC_CLIENT_ID:-}" ]; then
                echo "no Zitadel client yet: skipping the zitadel login source"
                exit 0
              fi
              set -- --name zitadel --provider openidConnect \
                --key "$OIDC_CLIENT_ID" --secret "$OIDC_CLIENT_SECRET" \
                --auto-discover-url https://auth.kirillorlov.pro/.well-known/openid-configuration \
                --scopes openid --scopes profile --scopes email --skip-local-2fa
              id=$(forgejo admin auth list | awk '$2 == "zitadel" { print $1 }')
              if [ -n "$id" ]; then
                forgejo admin auth update-oauth --id "$id" "$@"
              else
                forgejo admin auth add-oauth "$@"
              fi
          envFrom: &config
            - configMapRef:
                name: forgejo-config
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-zitadel
                  key: client_id
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-zitadel
                  key: client_secret
                  optional: true
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts: &mounts
            - mountPath: /var/lib/gitea
              name: data
            - mountPath: /tmp/gitea
              name: tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      containers:
        - name: forgejo
          image: 'codeberg.org/forgejo/forgejo:17.0.1-rootless'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          envFrom: *config
          securityContext: *containerSecurity
          volumeMounts: *mounts
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            # Mirror syncs run git fetch in-process; large repositories need
            # headroom for pack indexing.
            limits:
              cpu: 2000m
              memory: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
data:
  GITEA__server__DOMAIN: git.kirillorlov.pro
  GITEA__server__ROOT_URL: https://git.kirillorlov.pro/
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__DISABLE_SSH: "true"
  GITEA__server__START_SSH_SERVER: "false"
  GITEA__server__LFS_START_SERVER: "true"
  GITEA__database__DB_TYPE: sqlite3
  GITEA__security__INSTALL_LOCK: "true"
  # One local admin, no sign-ups, nothing visible without signing in:
  # private GitHub repositories land here too.
  GITEA__service__DISABLE_REGISTRATION: "true"
  # Zitadel login never creates accounts. The first Zitadel sign-in shows
  # "link to an existing account": sign in once as the local admin there,
  # and from then on Zitadel logs straight into that account.
  GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "false"
  GITEA__oauth2_client__ACCOUNT_LINKING: login
  GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
  GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
  GITEA__repository__DEFAULT_PRIVATE: private
  # Every pull mirror refreshes hourly unless set otherwise per repository.
  GITEA__mirror__DEFAULT_INTERVAL: 1h
  GITEA__mirror__MIN_INTERVAL: 10m
  # Migrations (which is how mirrors are created) may only pull from GitHub.
  GITEA__migrations__ALLOWED_DOMAINS: "github.com,*.github.com,*.githubusercontent.com"
  GITEA__cron_0X2E_update_checker__ENABLED: "false"
  GITEA__log__LEVEL: Info
