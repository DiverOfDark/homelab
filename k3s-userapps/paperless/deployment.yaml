apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  progressDeadlineSeconds: 600
  strategy:
    type:
      Recreate
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/pod: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: paperless
    spec:
      volumes:
        - name: paperless
          persistentVolumeClaim:
            claimName: paperless
      containers:
        # Pinned by digest: with a bare `redis:8` each node keeps whatever it
        # pulled first, and an older Redis cannot load a dump written by a newer
        # one ("Can't handle RDB format version 15", 2026-11-15).
        - image: 'docker.io/library/redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53'
          name: redis
          ports:
            - containerPort: 6379
              protocol: TCP
              name: "http"
          volumeMounts:
            - mountPath: /data
              name: paperless
              subPath: redis
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 15
        - image: 'ghcr.io/paperless-ngx/paperless-ngx:3.5.1'
          name: paperless
          ports:
            - containerPort: 8000
              protocol: TCP
              name: "http"
          env:
            - name: PAPERLESS_PORT
              value: "8000"
            # Keep v2 behaviour: v3 defaults to skipping archives for born-digital
            # PDFs and to accepting duplicate documents.
            - name: PAPERLESS_ARCHIVE_FILE_GENERATION
              value: always
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: "true"
            - name: PAPERLESS_REDIS
              value: redis://localhost:6379
            - name: PAPERLESS_OCR_LANGUAGES
              value: rus eng deu
            - name: PAPERLESS_URL
              value: https://paperless.kirillorlov.pro
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_ADMIN_USER
              value: diverofdark
          envFrom:
            - secretRef:
                name: paperless-secret
          volumeMounts:
            - mountPath: /usr/src/paperless/data
              name: paperless
              subPath: data
            - mountPath: /usr/src/paperless/media
              name: paperless
              subPath: media
            - mountPath: /usr/src/paperless/export
              name: paperless
              subPath: export
            - mountPath: /usr/src/paperless/consume
              name: paperless
              subPath: consume
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3