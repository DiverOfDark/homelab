apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    hugin.dev/enabled: "true"
    hugin.dev/href: "https://paperless.kirillorlov.pro"
    hugin.dev/group: Apps
    hugin.dev/name: Paperless
    hugin.dev/icon: paperless.png
    hugin.dev/pod-selector: "app.kubernetes.io/pod=paperless"
    hugin.dev/widget.type: paperlessngx
    hugin.dev/widget.url: http://paperless.paperless.svc.cluster.local
    hugin.dev/widget.key-from-secret: paperless-secret/PAPERLESS_API_KEY
    # Blank on purpose: overwrites what the removed annotation applier wrote into
    # the live object. Delete these blank annotations once this has synced.
    hugin.dev/widget.key: ""
    kirillorlov.pro/annotationsFromSecretState: ""
  name: paperless
  namespace: paperless
spec:
  rules:
  - host: paperless.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: paperless
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - paperless.kirillorlov.pro
    secretName: paperless-tls
