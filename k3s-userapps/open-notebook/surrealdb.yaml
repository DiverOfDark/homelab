apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: open-notebook
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/pod: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: surrealdb
    spec:
      # The image is distroless and runs as nonroot (65532); fsGroup makes the
      # fresh RBD volume writable for it.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surrealdb
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:v2.7.0
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --log
            - info
            - --user
            - root
            - --pass
            - $(SURREAL_PASSWORD)
            - rocksdb:/mydata/mydatabase.db
          env:
            - name: SURREAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-notebook
                  key: SURREAL_PASSWORD
          ports:
            - containerPort: 8000
              name: surreal
          volumeMounts:
            - mountPath: /mydata
              name: data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: open-notebook
spec:
  ports:
    - name: surreal
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/pod: surrealdb
  type: ClusterIP
