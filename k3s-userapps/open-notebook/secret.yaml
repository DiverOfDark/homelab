# Values generated by terraform/open-notebook.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-notebook
  namespace: open-notebook
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: open-notebook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPEN_NOTEBOOK_ENCRYPTION_KEY
      remoteRef:
        key: open-notebook
        property: encryption_key
    - secretKey: OPEN_NOTEBOOK_PASSWORD
      remoteRef:
        key: open-notebook
        property: password
    - secretKey: SURREAL_PASSWORD
      remoteRef:
        key: open-notebook
        property: surreal_password
