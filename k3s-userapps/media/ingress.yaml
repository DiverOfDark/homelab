apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://jackett.kirillorlov.pro"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Jackett
    gethomepage.dev/icon: jackett.png
    gethomepage.dev/pod-selector: "app.kubernetes.io/pod=jackett"
    gethomepage.dev/widget.type: "jackett"
    gethomepage.dev/widget.url: "http://jackett.media.svc.cluster.local"
    # For hugin's widget generator: Jackett runs without an API key here.
    gethomepage.dev/widget.hint: "No API key is configured: send apikey=undefined. Jackett then redirects to its login, which sets session cookies and returns HTML. When the answer is not JSON, retry once with response.cookies joined as the Cookie header, and keep that cookie in state."
  name: jackett
  namespace: media
spec:
  rules:
  - host: jackett.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: jackett
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - jackett.kirillorlov.pro
    secretName: jackett-tls
---
