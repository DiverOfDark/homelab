apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    hugin.dev/enabled: "true"
    hugin.dev/href: "https://jackett.kirillorlov.pro"
    hugin.dev/group: Media
    hugin.dev/name: Jackett
    hugin.dev/icon: jackett.png
    hugin.dev/pod-selector: "app.kubernetes.io/pod=jackett"
    hugin.dev/widget.type: "jackett"
    hugin.dev/widget.url: "http://jackett.media.svc.cluster.local"
    # For hugin's widget generator: Jackett runs without an API key here.
    hugin.dev/widget.hint: "No API key is configured: send apikey=undefined. Jackett then redirects to its login, which sets session cookies and returns HTML. When the answer is not JSON, retry once with response.cookies joined as the Cookie header, and keep that cookie in state. Add configured=true to list only the configured indexers; the full list is 1.6 MB."
  name: jackett
  namespace: media
spec:
  rules:
  - host: jackett.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: jackett
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - jackett.kirillorlov.pro
    secretName: jackett-tls
---
