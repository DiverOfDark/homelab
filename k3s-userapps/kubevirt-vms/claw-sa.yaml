apiVersion: v1
kind: ServiceAccount
metadata:
  name: claw-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # roleRef is immutable — renamed from claw-admin (readonly) so ArgoCD
  # recreates instead of failing to patch.
  name: claw-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: claw-admin
    namespace: kubevirt-vms