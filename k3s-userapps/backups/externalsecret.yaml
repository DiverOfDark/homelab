# S3 credentials for the backup housekeeping jobs in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3-credentials
  namespace: backups
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: backup-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: yggdrasil_access_key
      remoteRef: {key: yggdrasil-s3, property: access_key}
    - secretKey: yggdrasil_secret_key
      remoteRef: {key: yggdrasil-s3, property: secret_key}
    - secretKey: wasabi_access_key
      remoteRef: {key: wasabi, property: access_key}
    - secretKey: wasabi_secret_key
      remoteRef: {key: wasabi, property: secret_key}
    # bunny storage zones carry their own S3 credentials:
    # "homelab" zone = Velero's bunny BackupStorageLocation,
    # "cnpg" zone = off-site CNPG copies (terraform/bunny.tf).
    - secretKey: bunny_velero_access_key
      remoteRef: {key: bunny/storage, property: access_key}
    - secretKey: bunny_velero_secret_key
      remoteRef: {key: bunny/storage, property: secret_key}
    - secretKey: bunny_cnpg_access_key
      remoteRef: {key: bunny/storage-cnpg, property: access_key}
    - secretKey: bunny_cnpg_secret_key
      remoteRef: {key: bunny/storage-cnpg, property: secret_key}
