apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runner-gitimage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.15.1
    chart: gha-runner-scale-set
    helm:
      valuesObject:
        githubConfigUrl: "https://github.com/DiverOfDark/gitimage"
        githubConfigSecret: github-secret
        # Workflows use `runs-on: gitimage-e2e` (repo variable E2E_RUNS_ON). Fork PRs never
        # reach these runners: the pipeline routes them to GitHub-hosted runners.
        runnerScaleSetName: gitimage-e2e

        # Each e2e job creates a kind cluster (plus registry, S3, Gitea containers) in its own
        # dind sidecar: no shared docker names between parallel jobs, and the containers' ports
        # published on 127.0.0.1 are reachable from the runner (same pod network). The sidecar is
        # privileged, so /dev/kvm is visible for the Kata e2e jobs.
        #
        # This is ARC's `containerMode: dind` spec written out (as generated by 0.15.1) with
        # `--mtu=1230` (see below) and one more addition: the node's /lib/modules, read-only, in the dind sidecar. kind mounts its
        # host's /lib/modules into every node, and kata-deploy modprobes vhost_vsock there with
        # the host's own modprobe; without the Talos modules it fails with
        # "Module vhost_vsock not found".

        # 3 kind clusters at a time on asgard (12 threads / 64 GB); the pipeline's matrix is 6 jobs.
        maxRunners: 3
        minRunners: 0
        controllerServiceAccount:
          name: "github-runner-controller-gha-rs-controller"
          namespace: "github-runner"

        template:
          spec:
            restartPolicy: Never
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - asgard
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:latest
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker:dind
                restartPolicy: Always
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                  # Pod MTU is 1230 (Cilium vxlan, cilium-config mtu). dockerd's bridge defaults to
                  # 1500, so job containers' larger packets were dropped ("Connection reset by
                  # peer" on git clone in container jobs). kind copies the default bridge MTU
                  # into its own network, so this covers the kind clusters too.
                  - --mtu=1230
                  # --mtu only covers the default bridge; job containers run on networks the
                  # runner creates (github_network_*), which would still default to 1500.
                  - --default-network-opt=bridge=com.docker.network.driver.mtu=1230
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  periodSeconds: 5
                  failureThreshold: 24
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
                  - name: lib-modules
                    mountPath: /lib/modules
                    readOnly: true
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: "4"
                    memory: 12Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
              - name: lib-modules
                hostPath:
                  path: /lib/modules
                  type: Directory
  destination:
    server: https://kubernetes.default.svc
    namespace: github-runner
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
