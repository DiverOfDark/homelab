# Runner scale set for the Renovate agent of the app repos (DiverOfDark/renovate-config:
# .github/workflows/renovate-agent.yml, `runs-on: renovate-agent-apps`). Registered to that
# repo, which runs the agent for all app repos, one run per repo (runners of a personal
# account are per repo).
# Job pods use the same read-only `renovate-agent` ServiceAccount and hook template as the
# homelab agent, see renovate-agent.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runner-renovate-agent-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.15.1
    chart: gha-runner-scale-set
    helm:
      valuesObject:
        githubConfigUrl: "https://github.com/DiverOfDark/renovate-config"

        githubConfigSecret: github-secret

        runnerScaleSetName: renovate-agent-apps

        containerMode:
          type: "kubernetes-novolume"

        # Up to 4 repos at once (each repo's Renovate run starts one; the workflow allows one
        # run per repo); no idle runner. The job pods are light: Claude CLI, gh, kubectl.
        maxRunners: 4
        minRunners: 0
        controllerServiceAccount:
          name: "github-runner-controller-gha-rs-controller"
          namespace: "github-runner"

        template:
          spec:
            restartPolicy: Never
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - asgard
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                env:
                  - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                    value: /etc/hook-extension/template.yaml
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 2Gi
                volumeMounts:
                  - name: hook-extension
                    mountPath: /etc/hook-extension
                    readOnly: true
            volumes:
              - name: hook-extension
                configMap:
                  name: hook-extension-renovate-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: github-runner
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
