apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    hugin.dev/enabled: "true"
    hugin.dev/href: "https://cloud.kirillorlov.pro"
    hugin.dev/group: Apps
    hugin.dev/name: Nextcloud
    hugin.dev/icon: nextcloud.png
    hugin.dev/pod-selector: "app.kubernetes.io/pod=nextcloud"
    hugin.dev/widget.type: nextcloud
    hugin.dev/widget.url: http://nextcloud.nextcloud.svc.cluster.local
    hugin.dev/widget.key-from-secret: nextcloud-secret/WIDGET_KEY
    # Blank on purpose: overwrites what the removed annotation applier wrote into
    # the live object. Delete these blank annotations once this has synced.
    hugin.dev/widget.key: ""
    kirillorlov.pro/annotationsFromSecretState: ""
  name: nextcloud
  namespace: nextcloud
  labels:
    kirillorlov.pro/expose: external
spec:
  rules:
  - host: cloud.kirillorlov.pro
    http:
      paths:
      - backend:
          service:
            name: nextcloud
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - cloud.kirillorlov.pro
    secretName: cloud-tls

