apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-orphan-cleanup
  namespace: backup-orphan-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-orphan-cleanup
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["list"]
  - apiGroups: ["velero.io"]
    resources: ["podvolumebackups", "datauploads"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-orphan-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-orphan-cleanup
subjects:
  - kind: ServiceAccount
    name: backup-orphan-cleanup
    namespace: backup-orphan-cleanup
---
# Only the velero namespace: drop BackupRepository CRs of removed namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-orphan-cleanup
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backuprepositories"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-orphan-cleanup
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-orphan-cleanup
subjects:
  - kind: ServiceAccount
    name: backup-orphan-cleanup
    namespace: backup-orphan-cleanup
